<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow Wait V3</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>🌈 Rainbow Wait</h1><div class="controls"><button onclick="setPreset(5)">5 min</button><button onclick="setPreset(10)">10 min</button><input id="minutesInput" type="number" value="5"><button onclick="startTimer()">Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset</button><button onclick="toggleTVMode()">TV Mode</button><select id="themeSelect" onchange="changeTheme()"><option value="rainbow">Rainbow</option><option value="rocket">Rocket</option><option value="hourglass">Hourglass</option></select></div><div class="progress-ring"><div class="inner-circle"><div id="timeDisplay">05:00</div></div></div><div id="scene"><div id="rocket" class="hidden">🚀</div><div id="hourglass" class="hidden">⏳</div><div id="rainbow" >🌈☁️☁️</div></div><div id="celebration" class="hidden">🎉🎉🎉</div></div><script src="app.js"></script></body></html>
